<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Adventures</title>
<link rel="stylesheet" href="adventures.css">
</head>
<body>

<!-- ============ opening title card ============ -->
<div id="intro" class="intro">
  <div class="intro-inner">
    <p class="intro-kicker" data-field="kicker">A few years of getting into things</p>
    <h1 class="intro-title" data-field="title">Adventures</h1>
    <p class="intro-sub" data-field="subtitle">for you</p>
    <button id="intro-open" class="intro-open" type="button">Open it</button>
  </div>
</div>

<!-- ============ the collection ============ -->
<div id="app" class="app" hidden>

  <header class="masthead">
    <div class="masthead-row">
      <h1 class="masthead-title" data-field="title">Adventures</h1>
      <button id="replay-intro" class="ghost-btn" type="button" title="Back to the title card">&#8598;</button>
    </div>
    <p class="masthead-sub" data-field="dedication"></p>
    <p class="tally" id="tally"></p>
  </header>

  <nav class="filters" id="filters" aria-label="Filter adventures"></nav>

  <main id="timeline" class="timeline"></main>

  <p class="empty" id="empty" hidden>Nothing here yet — check <code>adventures.js</code>.</p>

  <footer class="colophon">
    <p data-field="colophon"></p>
  </footer>
</div>

<!-- ============ viewer ============ -->
<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <button class="viewer-close" id="viewer-close" type="button" aria-label="Close">&#10005;</button>
  <button class="viewer-nav viewer-prev" id="viewer-prev" type="button" aria-label="Previous adventure">&#8249;</button>
  <button class="viewer-nav viewer-next" id="viewer-next" type="button" aria-label="Next adventure">&#8250;</button>

  <div class="viewer-inner">
    <div class="stage">
      <div class="stage-media" id="stage-media"></div>
    </div>
    <div class="viewer-meta">
      <p class="viewer-when" id="viewer-when"></p>
      <h2 class="viewer-title" id="viewer-title"></h2>
      <p class="viewer-where" id="viewer-where"></p>
      <p class="viewer-note" id="viewer-note"></p>
      <div class="clipstrip" id="clipstrip" hidden></div>
      <p class="viewer-tags" id="viewer-tags"></p>
    </div>
  </div>
</div>

<script src="adventures.js"></script>
<script src="app.js"></script>
</body>
</html>
